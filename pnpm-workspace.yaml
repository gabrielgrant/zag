packages:
  - packages/**
  - shared
  - examples/**
  # qwik's SSR build emits server/package.json inside the example; exclude it
  # so build output is never picked up as a workspace package
  - '!examples/qwik-ts/server'
  - starters/**
  - website

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
